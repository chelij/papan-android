plugins { id 'com.android.application' version '8.9.3' }

layout.buildDirectory.set(file('../artifacts/android/gradle-build'))
android {
    namespace 'com.papan.share'
    compileSdk 35
    defaultConfig {
        applicationId 'com.papan.share'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.1'
    }
    flavorDimensions = ['installation']
    productFlavors {
        personal { dimension 'installation' }
        isolated { dimension 'installation'; applicationIdSuffix '.test' }
    }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src']; res.srcDirs = ['res']; assets.srcDirs = ['../artifacts/android/gradle-assets'] }
        isolated { manifest.srcFile 'isolated-manifest.xml'; java.srcDirs = ['test'] }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig null }
        qa { debuggable true; minifyEnabled false; signingConfig null; matchingFallbacks = ['debug', 'release'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'com.google.zxing:core:3.5.4'
}
configurations { sourceArchives { transitive = false } }
dependencies {
    sourceArchives 'com.google.android.material:material:1.13.0:sources@jar'
    sourceArchives 'com.google.zxing:core:3.5.4:sources@jar'
}
tasks.register('copyDependencySources', Copy) {
    from configurations.sourceArchives
    into '../artifacts/android/gradle-assets/third-party'
}
tasks.named('preBuild') { dependsOn 'copyDependencySources' }
dependencyLocking { lockAllConfigurations() }
