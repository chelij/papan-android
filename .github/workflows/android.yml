name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: npm run check
      - name: Compile and verify with a disposable signing key
        run: npm run build:android
      - name: Compile isolated device-test package
        run: npm run build:android -- --test
